{% extends 'base.html' %}{% block content %}<div class="page-title"><div><h1>المصانع</h1><p>المصانع الثلاثة ودوراتها المستقلة</p></div></div><div class="factory-grid">{% for f in factories %}<article class="factory-card"><div class="card-head"><span class="factory-icon">▦</span><div><h2>{{ f.name }}</h2><p>{{ f.code }}</p></div><span class="badge success">نشط</span></div><div class="meta"><span>{{ f.assets.all|length }} ماكينة مسجلة</span><span>{{ f.users.all|length }} مستخدم</span></div></article>{% endfor %}</div>{% endblock %}
