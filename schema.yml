openapi: 3.0.3
info:
  title: نظام إدارة الصيانة
  version: 1.0.0
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/mobile/bootstrap/:
    get:
      operationId: v1_mobile_bootstrap_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/mobile/current-maintenance/:
    get:
      operationId: v1_mobile_current_maintenance_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/mobile/current-maintenance/select/:
    post:
      operationId: v1_mobile_current_maintenance_select_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentAssetSelection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurrentAssetSelection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurrentAssetSelection'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/mobile/reports/:
    post:
      operationId: v1_mobile_reports_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInput'
          description: ''
  /api/v1/mobile/reports/{id}/:
    put:
      operationId: v1_mobile_reports_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInput'
          description: ''
  /api/v1/mobile/sync/reports/:
    post:
      operationId: v1_mobile_sync_reports_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSync'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchSync'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchSync'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSync'
          description: ''
  /api/v1/production/bootstrap/:
    get:
      operationId: v1_production_bootstrap_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/production/reports/confirm-handover/:
    post:
      operationId: v1_production_reports_confirm_handover_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmHandoverInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmHandoverInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmHandoverInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionShiftReport'
          description: ''
  /api/v1/production/sync/shift-reports/:
    post:
      operationId: v1_production_sync_shift_reports_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncShiftReportInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncShiftReportInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncShiftReportInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionShiftReport'
          description: ''
  /api/v1/updates/heartbeat/:
    post:
      operationId: v1_updates_heartbeat_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Heartbeat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Heartbeat'
        required: true
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/updates/latest/:
    get:
      operationId: v1_updates_latest_retrieve
      tags:
      - v1
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/updates/register/:
    post:
      operationId: v1_updates_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Registration'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/updates/releases/{id}/download/:
    get:
      operationId: v1_updates_releases_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
components:
  schemas:
    AnswerInput:
      type: object
      properties:
        checklist_item_id:
          type: integer
          minimum: 1
        checked:
          type: boolean
        note:
          type: string
          default: ''
      required:
      - checked
      - checklist_item_id
    BatchSync:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportInput'
      required:
      - reports
    BlankEnum:
      enum:
      - ''
    ConfirmHandoverInput:
      type: object
      properties:
        client_report_id:
          type: string
          format: uuid
        handover_notes:
          type: string
          default: ''
        decision:
          allOf:
          - $ref: '#/components/schemas/DecisionEnum'
          default: ACCEPT
      required:
      - client_report_id
    CurrentAssetSelection:
      type: object
      properties:
        asset_id:
          type: integer
          minimum: 1
      required:
      - asset_id
    DecisionEnum:
      enum:
      - ACCEPT
      - REJECT
      type: string
      description: |-
        * `ACCEPT` - ACCEPT
        * `REJECT` - REJECT
    EmergencyItemInput:
      type: object
      properties:
        asset_id:
          type: integer
          minimum: 1
        issue_description:
          type: string
          maxLength: 500
        responsible_person:
          type: string
          maxLength: 150
        notes:
          type: string
          default: ''
      required:
      - asset_id
      - issue_description
      - responsible_person
    Factory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: اسم المصنع
          maxLength: 100
        code:
          type: string
          maxLength: 20
      required:
      - code
      - id
      - name
    Heartbeat:
      type: object
      properties:
        version_code:
          type: integer
          maximum: 2147483647
          minimum: 1
        version_name:
          type: string
          maxLength: 100
        android_sdk:
          type: integer
          maximum: 100
          minimum: 23
        label:
          type: string
          maxLength: 150
        status:
          $ref: '#/components/schemas/HeartbeatStatusEnum'
        progress:
          type: integer
          maximum: 100
          minimum: 0
          default: 0
        error:
          type: string
          default: ''
          maxLength: 1000
        release_id:
          type: integer
          minimum: 1
          nullable: true
      required:
      - android_sdk
      - label
      - status
      - version_code
      - version_name
    HeartbeatStatusEnum:
      enum:
      - current
      - downloading
      - ready
      - permission
      - confirmation
      - installing
      - failed
      - incompatible
      type: string
      description: |-
        * `current` - يعمل بالإصدار المثبّت
        * `downloading` - جارٍ تنزيل التحديث
        * `ready` - التحديث جاهز للتثبيت
        * `permission` - ينتظر سماح Android بالتثبيت
        * `confirmation` - ينتظر تأكيد التثبيت من Android
        * `installing` - جارٍ التثبيت
        * `failed` - تعذر التحديث
        * `incompatible` - إصدار Android غير متوافق
    Login:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - phone
    MachineProductionEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        asset:
          type: integer
          title: الماكينة
        asset_code:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        production_title:
          type: string
          readOnly: true
        maintenance_title:
          type: string
          readOnly: true
        operator:
          type: integer
          nullable: true
          title: القائم على الماكينة
        operator_name:
          type: string
          title: اسم القائم على الماكينة
          maxLength: 150
        original_operator:
          type: integer
          nullable: true
          title: القائم على الماكينة الأصلي قبل التغيير
        original_operator_name:
          type: string
          title: القائم على الماكينة قبل التغيير
          maxLength: 150
        operator_changed:
          type: boolean
          title: تم تغيير القائم على الماكينة
        product:
          type: integer
          nullable: true
          title: المنتج الحالي
        product_name:
          type: string
          title: اسم المنتج
          maxLength: 150
        original_product:
          type: integer
          nullable: true
          title: المنتج الأصلي قبل التغيير
        original_product_name:
          type: string
          title: المنتج قبل التغيير
          maxLength: 150
        product_changed:
          type: boolean
          title: تم تغيير المنتج
        original_cavities:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: عدد اللقم الأصلي
        dashboard_defaults:
          type: string
          title: إعدادات الداشبورد وقت التسجيل
        current_cavities:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: عدد اللقم الحالية
        operation_mode:
          allOf:
          - $ref: '#/components/schemas/MachineProductionEntryOperationModeEnum'
          title: حالة التشغيل
        original_cooling_time_seconds:
          type: number
          format: double
          title: التبريد الأصلي (ثانية)
        original_cycle_time_seconds:
          type: number
          format: double
          title: الدورة الأصلية (ثانية)
        cooling_time_seconds:
          type: number
          format: double
          title: التبريد (ثانية)
        cycle_time_seconds:
          type: number
          format: double
          title: الدورة (ثانية)
        raw_material:
          type: string
          title: الخامة المستخدمة
          maxLength: 150
        final_production_weight_kg:
          type: number
          format: double
          title: وزن الإنتاج النهائي بالكيلو
        final_production_quantity:
          type: number
          format: double
          title: كمية الإنتاج النهائي
        final_production_unit:
          type: integer
          nullable: true
          title: وحدة الإنتاج الفعلي
        final_production_unit_name:
          type: string
          title: وحدة كمية الإنتاج
          maxLength: 100
        target_cycle_production:
          type: number
          format: double
          title: الإنتاج حسب زمن الدورة
        target_cycle_unit_name:
          type: string
          title: وحدة مستهدف الدورة
          maxLength: 100
        packaging_type:
          type: string
          title: العبوة
          maxLength: 100
        notes:
          type: string
          title: ملاحظات الماكينة
      required:
      - asset
      - asset_code
      - display_name
      - id
      - maintenance_title
      - production_title
    MachineProductionEntryOperationModeEnum:
      enum:
      - AUTO
      - MANUAL
      type: string
      description: |-
        * `AUTO` - أوتو
        * `MANUAL` - يدوي
    NullEnum:
      enum:
      - null
    ProductionShiftReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_report_id:
          type: string
          format: uuid
        factory:
          type: integer
          title: المصنع
        supervisor:
          type: integer
          title: مشرف الوردية
        supervisor_name:
          type: string
          readOnly: true
        shift:
          allOf:
          - $ref: '#/components/schemas/ProductionShiftReportShiftEnum'
          default: FIRST
          title: الوردية
        shift_display:
          type: string
          readOnly: true
        report_date:
          type: string
          format: date
          title: تاريخ الوردية
        started_at_device:
          type: string
          format: date-time
          nullable: true
          title: بداية الوردية
        completed_at_device:
          type: string
          format: date-time
          nullable: true
          title: نهاية الوردية
        status:
          allOf:
          - $ref: '#/components/schemas/ProductionShiftReportStatusEnum'
          title: الحالة
        status_display:
          type: string
          readOnly: true
        handover_to_supervisor:
          type: integer
          nullable: true
          title: المشرف المستلم
        handover_to_supervisor_name:
          type: string
          readOnly: true
          default: ''
        handover_confirmed_at:
          type: string
          format: date-time
          nullable: true
          title: تاريخ وتوقيت الاستلام
        handover_notes:
          type: string
          title: ملاحظات الاستلام
        general_notes:
          type: string
          title: ملاحظات عامة عن الوردية
        total_production_weight_kg:
          type: number
          format: double
          readOnly: true
        changed_products_count:
          type: integer
          readOnly: true
        changed_operators_count:
          type: integer
          readOnly: true
        machine_entries:
          type: array
          items:
            $ref: '#/components/schemas/MachineProductionEntry'
          readOnly: true
        stoppages:
          type: array
          items:
            $ref: '#/components/schemas/ProductionStoppage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_operators_count
      - changed_products_count
      - created_at
      - factory
      - handover_to_supervisor_name
      - id
      - machine_entries
      - report_date
      - shift_display
      - status_display
      - stoppages
      - supervisor
      - supervisor_name
      - total_production_weight_kg
    ProductionShiftReportShiftEnum:
      enum:
      - FIRST
      - SECOND
      - THIRD
      type: string
      description: |-
        * `FIRST` - الوردية الأولى (صباحية)
        * `SECOND` - الوردية الثانية (مسائية)
        * `THIRD` - الوردية الثالثة (ليلية)
    ProductionShiftReportStatusEnum:
      enum:
      - DRAFT
      - PENDING_HANDOVER
      - CONFIRMED
      - REJECTED
      type: string
      description: |-
        * `DRAFT` - مسودة
        * `PENDING_HANDOVER` - بانتظار تأكيد استلام الوردية
        * `CONFIRMED` - تم الاستلام والاعتماد
        * `REJECTED` - غير مقبول
    ProductionStoppage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        asset:
          type: integer
          nullable: true
          title: الماكينة (فارغ إذا كان للمصنع كاملاً)
        asset_code:
          type: string
          readOnly: true
          default: ''
        display_name:
          type: string
          readOnly: true
          default: ''
        stoppage_type:
          allOf:
          - $ref: '#/components/schemas/StoppageTypeEnum'
          title: نوع التوقف / العطل
        stoppage_type_display:
          type: string
          readOnly: true
        description:
          type: string
          title: وصف العطل أو سبب التوقف
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: مدة التوقف (بالدقائق)
        action_taken:
          type: string
          title: الإجراء المتخذ / الحل
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset_code
      - created_at
      - description
      - display_name
      - id
      - stoppage_type_display
    Registration:
      type: object
      properties:
        version_code:
          type: integer
          maximum: 2147483647
          minimum: 1
        version_name:
          type: string
          maxLength: 100
        android_sdk:
          type: integer
          maximum: 100
          minimum: 23
        label:
          type: string
          maxLength: 150
        device_id:
          type: string
          format: uuid
        device_secret:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - android_sdk
      - device_id
      - device_secret
      - label
      - version_code
      - version_name
    ReportInput:
      type: object
      properties:
        client_report_id:
          type: string
          format: uuid
        asset_id:
          type: integer
          minimum: 1
        report_date:
          type: string
          format: date
        started_at_device:
          type: string
          format: date-time
        completed_at_device:
          type: string
          format: date-time
        last_modified_at_device:
          type: string
          format: date-time
        cleaner_name:
          type: string
          default: ''
        mechanical_technician:
          type: string
          default: ''
        electrical_technician:
          type: string
          default: ''
        maintenance_manager:
          type: string
          default: ''
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
        emergency_items:
          type: array
          items:
            $ref: '#/components/schemas/EmergencyItemInput'
      required:
      - answers
      - asset_id
      - client_report_id
      - completed_at_device
      - last_modified_at_device
      - report_date
      - started_at_device
    RoleEnum:
      enum:
      - ADMIN
      - MAINTENANCE_SUPERVISOR
      - PRODUCTION_SUPERVISOR
      - GENERAL_SUPERVISOR
      type: string
      description: "* `ADMIN` - \U0001F451 مسؤول عام (كافة الصلاحيات والمصانع)\n*
        `MAINTENANCE_SUPERVISOR` - \U0001F6E0️ مشرف صيانة دورية (صلاحيات الصيانة لمصنعه
        فقط)\n* `PRODUCTION_SUPERVISOR` - \U0001F3ED مشرف إنتاج وأعطال (صلاحيات الإنتاج
        والأعطال لمصنعه فقط)\n* `GENERAL_SUPERVISOR` - ⚡ مشرف عام للمصنع (صيانة وإنتاج
        لمصنعه فقط)"
    StoppageTypeEnum:
      enum:
      - MACHINE_BREAKDOWN
      - MOLD_CHANGE
      - FRIDAY_PRAYER
      - POWER_OUTAGE
      - RAW_MATERIAL_SHORTAGE
      - OTHER
      type: string
      description: |-
        * `MACHINE_BREAKDOWN` - عطل ماكينة
        * `MOLD_CHANGE` - تغيير اسطمبة / منتج
        * `FRIDAY_PRAYER` - إيقاف صلاة الجمعة لجميع الماكينات
        * `POWER_OUTAGE` - انقطاع كهرباء عام
        * `RAW_MATERIAL_SHORTAGE` - نقص خامات أو مياه تبريد
        * `OTHER` - توقف آخر
    SyncMachineEntryInput:
      type: object
      properties:
        dashboard_defaults:
          type: string
          maxLength: 20000
        asset_id:
          type: integer
        operator_id:
          type: integer
          nullable: true
        operator_name:
          type: string
          default: ''
        original_operator_id:
          type: integer
          nullable: true
        original_operator_name:
          type: string
          default: ''
        operator_changed:
          type: boolean
          default: false
        product_id:
          type: integer
          nullable: true
        product_name:
          type: string
          default: ''
        original_product_id:
          type: integer
          nullable: true
        original_product_name:
          type: string
          default: ''
        product_changed:
          type: boolean
          default: false
        original_cavities:
          type: integer
          minimum: 1
        current_cavities:
          type: integer
          minimum: 1
        operation_mode:
          allOf:
          - $ref: '#/components/schemas/SyncMachineEntryInputOperationModeEnum'
          default: AUTO
        original_cooling_time_seconds:
          type: number
          format: double
          minimum: 0
          nullable: true
        original_cycle_time_seconds:
          type: number
          format: double
          minimum: 0
          nullable: true
        cooling_time_seconds:
          type: number
          format: double
          minimum: 0
          nullable: true
        cycle_time_seconds:
          type: number
          format: double
          minimum: 0
          nullable: true
        raw_material:
          type: string
          default: ''
        final_production_weight_kg:
          type: number
          format: double
          minimum: 0
          default: 0.0
        final_production_quantity:
          type: number
          format: double
          minimum: 0
          nullable: true
        final_production_unit_id:
          type: integer
          nullable: true
        raw_material_option_id:
          type: integer
          nullable: true
        packaging_option_id:
          type: integer
          nullable: true
        target_cycle_production:
          type: number
          format: double
          minimum: 0
          default: 0.0
        packaging_type:
          type: string
          default: ''
        notes:
          type: string
          default: ''
      required:
      - asset_id
    SyncMachineEntryInputOperationModeEnum:
      enum:
      - AUTO
      - MANUAL
      type: string
      description: |-
        * `AUTO` - AUTO
        * `MANUAL` - MANUAL
    SyncShiftReportInput:
      type: object
      properties:
        client_report_id:
          type: string
          format: uuid
        supervisor_id:
          type: integer
          minimum: 1
          nullable: true
        factory_id:
          type: integer
          minimum: 1
          nullable: true
        shift:
          allOf:
          - $ref: '#/components/schemas/SyncShiftReportInputShiftEnum'
          default: FIRST
        report_date:
          type: string
          format: date
        started_at_device:
          type: string
          format: date-time
          nullable: true
        completed_at_device:
          type: string
          format: date-time
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/SyncShiftReportInputStatusEnum'
          default: PENDING_HANDOVER
        general_notes:
          type: string
          default: ''
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SyncMachineEntryInput'
          default: []
        stoppages:
          type: array
          items:
            $ref: '#/components/schemas/SyncStoppageInput'
          default: []
      required:
      - client_report_id
      - report_date
    SyncShiftReportInputShiftEnum:
      enum:
      - FIRST
      - SECOND
      - THIRD
      type: string
      description: |-
        * `FIRST` - FIRST
        * `SECOND` - SECOND
        * `THIRD` - THIRD
    SyncShiftReportInputStatusEnum:
      enum:
      - DRAFT
      - PENDING_HANDOVER
      type: string
      description: |-
        * `DRAFT` - DRAFT
        * `PENDING_HANDOVER` - PENDING_HANDOVER
    SyncStoppageInput:
      type: object
      properties:
        asset_id:
          type: integer
          nullable: true
        stoppage_type:
          type: string
          default: MACHINE_BREAKDOWN
        description:
          type: string
        duration_minutes:
          type: integer
          minimum: 0
          default: 0
        action_taken:
          type: string
          default: ''
      required:
      - description
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: اسم المستخدم
          maxLength: 150
        phone:
          type: string
          title: رقم الهاتف
          maxLength: 30
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: الدور والصلاحيات
        factory:
          allOf:
          - $ref: '#/components/schemas/Factory'
          readOnly: true
        shift:
          nullable: true
          title: الوردية المسندة
          description: |-
            حدد الوردية المخصصة للمشرف: صباحية (7 ص - 3 م)، مسائية (3 م - 11 م)، أو ليلية (11 م - 7 ص). لا يمكن تسجيل التقرير إلا خلال ساعات ورديته وفترة السماح المحددة. وتقارير الصيانة مخصصة لمشرف الوردية الصباحية فقط.

            * `FIRST` - الوردية الأولى (صباحية: 7 ص - 3 م)
            * `SECOND` - الوردية الثانية (مسائية: 3 م - 11 م)
            * `THIRD` - الوردية الثالثة (ليلية: 11 م - 7 ص)
          oneOf:
          - $ref: '#/components/schemas/UserShiftEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        shift_display:
          type: string
          readOnly: true
        report_grace_hours:
          type: integer
          readOnly: true
      required:
      - display_name
      - factory
      - id
      - phone
      - report_grace_hours
      - shift_display
    UserShiftEnum:
      enum:
      - FIRST
      - SECOND
      - THIRD
      type: string
      description: |-
        * `FIRST` - الوردية الأولى (صباحية: 7 ص - 3 م)
        * `SECOND` - الوردية الثانية (مسائية: 3 م - 11 م)
        * `THIRD` - الوردية الثالثة (ليلية: 11 م - 7 ص)
  securitySchemes:
    DeviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: Device secret. Also send X-Device-ID from authenticated registration.
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
